<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open World Space Tycoon</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div>Credits: <span id="hud-credits">0</span></div>
        <div>Fuel: <span id="hud-fuel">0</span></div>
        <div>Ammo: <span id="hud-ammo">0</span></div>
        <div>Cargo: <span id="hud-cargo">0/0</span></div>
        <div>Map: <span id="hud-map">-</span></div>
        <div>Station: <span id="hud-station">-</span></div>
      </div>
      <div id="market-panel" class="hidden">
        <h2>Station Market</h2>
        <div id="market-services"></div>
        <div id="market-goods"></div>
        <div class="market-help">Press E to close market</div>
      </div>
      <div id="game-over" class="hidden">
        <div class="game-over-panel">
          <h2>Game Over</h2>
          <p id="game-over-message">You crashed.</p>
          <div class="game-over-help">Press N for a new game</div>
        </div>
      </div>
      <div id="help-bar">Move: Arrow Keys | Fire: Space | Dock/Trade: E | Gate Jump: G | New Game: N</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
