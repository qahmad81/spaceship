<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Island Navigator - Space Routes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Island Navigator</h1>
            <div class="game-info">
                <div class="speed-indicator">Speed: <span id="speed">0</span></div>
                <div class="fuel-indicator">Fuel: <span id="fuelDisplay">1000</span></div>
                <div class="projectile-indicator">Ammo: <span id="projectileDisplay">5</span></div>
                <div class="objective" id="objectiveText">Objective: Reach destination station</div>
            </div>
        </div>

        <div class="game-canvas-container">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>

        <div class="controls-info">
            <h3>Controls</h3>
            <div class="controls-grid">
                <div class="control-item">Up Arrow: Thrust forward</div>
                <div class="control-item">Down Arrow: Reverse thrust</div>
                <div class="control-item">Left Arrow: Rotate left</div>
                <div class="control-item">Right Arrow: Rotate right</div>
                <div class="control-item">Space: Fire projectile</div>
            </div>
        </div>

        <div class="game-status">
            <div id="gameMessage">Use arrow keys to pilot the spaceship.</div>
        </div>
    </div>

    <div id="overlay">
        <div id="overlay-content"></div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
